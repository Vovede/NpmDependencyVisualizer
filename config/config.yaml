# Имя анализируемого npm-пакета
package_name: "lodash"

# URL репозитория или путь к тестовому репозиторию
repository: "https://registry.npmjs.org"

# Режим работы с тестовым репозиторием
test_mode: false

# Версия анализируемого пакета
version: "4.17.21"

# Имя выходного файла с изображением графа
output_file: "dependency_graph.png"

# Максимальная глубина анализа зависимостей
max_depth: 3

# Подстрока для фильтрации пакетов
filter_substring: ""